# Builds the Docker image for the NAS after every push to the branch "release" (only when all tests pass).
# The NAS does not update by itself: in the NAS admin panel (Paneel -> Updates) a beheerder chooses when (once ClaudeSuite is in UPDATE_APPS).
name: Release image

on:
  push:
    branches: [release]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      # The first line of the commit message, shown in the panel as "what is new" (read with git, never pasted into a script)
      - id: info
        run: |
          echo "message=$(git log -1 --pretty=%s | tr -d '\r' | cut -c1-150)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stolemynikes/claudesuite:release
            ghcr.io/stolemynikes/claudesuite:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.info.outputs.created }}
            org.opencontainers.image.description=${{ steps.info.outputs.message }}

